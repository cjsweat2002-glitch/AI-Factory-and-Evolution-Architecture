services:
  - type: web
    name: ai-factory-birth
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: AI_FACTORY_MODEL
        value: llama3
      - key: AI_FACTORY_WORKER_URL
        sync: false
      - key: AI_FACTORY_NODES
        sync: false
      - key: GITHUB_REPO
        value: cjsweat2002-glitch/AI-Factory-and-Evolution-Architecture
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false
