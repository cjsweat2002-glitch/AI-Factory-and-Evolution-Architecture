services:
  - type: web
    name: ai-factory-birth
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: AI_FACTORY_MODEL
        value: llama3
      - key: AI_FACTORY_WORKER_URL
        sync: false
      - key: AI_FACTORY_NODES
        sync: false
      - key: AI_FACTORY_ACCESS_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
