name: Bug report
description: Report a reproducible defect in the gateway or autonomy workflows.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Worker gateway and routing
        - Health checks
        - Native agent and issue workflows
        - Research and evidence memory
        - Signal graph and QA inquiries
        - Authority genomes
        - Simulations and brand factory
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include the smallest reliable sequence; remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include relevant logs, versions, configuration shape, and test results. Never paste credentials.
    validations:
      required: true
