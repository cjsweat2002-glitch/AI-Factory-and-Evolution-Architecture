[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pool-coordinator"
version = "0.1.0"
description = "Custom distributed AI model pool and load balancer"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
